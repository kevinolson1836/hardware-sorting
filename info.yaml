# Tiny Tapeout project information
project:
  title: "Sorting Bars"
  author: "Kevin Olson"
  discord: ""
  description: "An LFSR fills 8 slots with random 3-bit values, an odd-even sorter sorts them, and the slots are scanned out as bars for an 8x8 LED matrix."
  language: "Verilog"
  clock_hz: 10000000

  # 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  tiles: "1x1"

  top_module: "tt_um_sorting_bars"

  source_files:
    - "tt_um_sorting_bars.v"

# The pinout descriptions below show up in the datasheet.
pinout:
  ui[0]: "Sort direction (0 = ascending, 1 = descending)"
  ui[1]: "Manual step mode (1 = advance only on the step button)"
  ui[2]: "Step button (rising edge = one tick)"
  ui[3]: "Auto speed bit 0"
  ui[4]: "Auto speed bit 1"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "Row 0 of the current column (bar bottom)"
  uo[1]: "Row 1"
  uo[2]: "Row 2"
  uo[3]: "Row 3"
  uo[4]: "Row 4"
  uo[5]: "Row 5"
  uo[6]: "Row 6"
  uo[7]: "Row 7 (bar top)"

  uio[0]: "Column select bit 0 (to decoder)"
  uio[1]: "Column select bit 1"
  uio[2]: "Column select bit 2"
  uio[3]: "Sorted / holding indicator"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
